<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Uploaded Files</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>My Uploaded Files</h1>
    {% if files %}
      {% for f in files %}
        <div class="file-item">
          <p>{{ f.name }}</p>
          <a href="{{ f.url }}" target="_blank">Download</a>
        </div>
      {% endfor %}
    {% else %}
      <p>No files uploaded yet.</p>
    {% endif %}
    <a href="{{ url_for('home') }}" class="back-button">Back to Upload</a>
  </div>
</body>
</html>
